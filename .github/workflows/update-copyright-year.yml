name: update copyright year

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update copyright year
        id: year
        shell: bash
        run: |
          year="$(date -u +%Y)"
          sed -i -E "s/^Copyright [0-9]{4} Ricardo Ribeiro \(0xjrr\)$/Copyright ${year} Ricardo Ribeiro (0xjrr)/" NOTICE
          sed -i -E "s/^   Copyright [0-9]{4} Ricardo Ribeiro \(0xjrr\)$/   Copyright ${year} Ricardo Ribeiro (0xjrr)/" LICENSE
          echo "year=${year}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update copyright year to ${{ steps.year.outputs.year }}"
          title: "Update copyright year to ${{ steps.year.outputs.year }}"
          body: "Updates the copyright year in LICENSE and NOTICE."
          branch: chore/update-copyright-year
          delete-branch: true